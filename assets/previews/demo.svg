<svg width="560" height="340" viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg">
  <!-- Terminal window -->
  <rect width="560" height="340" fill="#0d0d1a" rx="14"/>
  <!-- Title bar -->
  <rect width="560" height="36" fill="#18181f" rx="14"/>
  <rect width="560" height="18" y="18" fill="#18181f"/>
  <!-- Dots -->
  <circle cx="20" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="18" r="6" fill="#febc2e"/>
  <circle cx="56" cy="18" r="6" fill="#28c840"/>
  <!-- Title -->
  <text x="280" y="23" text-anchor="middle" fill="#505070" font-family="monospace" font-size="11">ai-git-commit</text>

  <!-- Content -->
  <!-- Line 1: command -->
  <text x="20" y="66" font-family="JetBrains Mono, monospace" font-size="12" fill="#505070">$</text>
  <text x="32" y="66" font-family="JetBrains Mono, monospace" font-size="12" fill="#e2e2f0">aic</text>
  <rect x="62" y="54" width="8" height="14" fill="#6c63ff" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Line 2: blank -->
  <!-- Line 3: brand -->
  <text x="20" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#6c63ff" font-weight="bold">  ai-git-commit</text>
  <text x="160" y="96" font-family="JetBrains Mono, monospace" font-size="12" fill="#505070"> v1.0.0</text>

  <!-- Line 4: staged files -->
  <text x="20" y="124" font-family="JetBrains Mono, monospace" font-size="12" fill="#e2e2f0">  <tspan fill="#9090b0">3 staged files:</tspan></text>

  <text x="20" y="142" font-family="JetBrains Mono, monospace" font-size="11" fill="#505070">  · M  src/auth/login.ts</text>
  <text x="20" y="157" font-family="JetBrains Mono, monospace" font-size="11" fill="#505070">  · A  src/auth/oauth.ts</text>
  <text x="20" y="172" font-family="JetBrains Mono, monospace" font-size="11" fill="#505070">  · M  tests/auth.test.ts</text>

  <!-- Spinner + generating -->
  <text x="20" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#6c63ff">
    ⠸
    <animate attributeName="opacity" values="1;0.3;1" dur="0.8s" repeatCount="indefinite"/>
  </text>
  <text x="36" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#9090b0"> Generating via openai...</text>

  <!-- Success -->
  <text x="20" y="224" font-family="JetBrains Mono, monospace" font-size="12" fill="#4ade80">  ✓</text>
  <text x="44" y="224" font-family="JetBrains Mono, monospace" font-size="12" fill="#9090b0"> Commit message generated</text>

  <!-- Generated commit line -->
  <text x="20" y="252" font-family="JetBrains Mono, monospace" font-size="13" font-weight="bold">
    <tspan fill="#6c63ff">feat</tspan><tspan fill="#9090b0">(</tspan><tspan fill="#f472b6">auth</tspan><tspan fill="#9090b0">)</tspan><tspan fill="#e2e2f0">: add OAuth2 login with Google provider</tspan>
  </text>

  <!-- Prompt line -->
  <text x="20" y="282" font-family="JetBrains Mono, monospace" font-size="11" fill="#9090b0">  ? What would you like to do?</text>
  <text x="20" y="298" font-family="JetBrains Mono, monospace" font-size="11" fill="#6c63ff">  ❯ Commit</text>
  <text x="20" y="313" font-family="JetBrains Mono, monospace" font-size="11" fill="#505070">    Edit   Regenerate   Cancel</text>
</svg>
